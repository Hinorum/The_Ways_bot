version: 2
updates:
  # Зависимости Python (requirements.txt / requirements-dev.txt) — еженедельно.
  # Версии Не прибиты к минорным: протестированы локально и в CI (покрытие и
  # alembic-дрифт-чек гоняются на каждой PR-ветке). Крупные минорные бампы
  # проще ревьюить из сгруппированных PR.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Moscow"
    versioning-strategy: "increase"
    groups:
      # Железный скелет бота: тестируем вместе, катим вместе.
      core-deps:
        patterns:
          - "aiogram"
          - "sqlalchemy"
          - "asyncpg"
          - "alembic"
          - "aiosqlite"
      # ТОН-стик: версии живут жизнью сети, бампы часто требуют ручной проверки
      # (мемо, счётчики, форматы хешей) — отдельным PR без авто-мержа.
      ton-side:
        patterns:
          - "pytoniq"
          - "pytoniq_core"
      # Служебное: можно катить пачкой.
      dev-and-tooling:
        patterns:
          - "pytest*"
          - "ruff"
          - "python-dotenv"

  # GitHub Actions — обновления чужого кода в workflows/.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Moscow"
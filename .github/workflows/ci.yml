name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff
      - name: Lint (runtime errors only)
        run: python -m ruff check app tests
      - name: Tests
        env:
          BOT_TOKEN: "123456:ci-dummy-token"
          ADMIN_IDS: "1"
        run: python -m pytest -q

  slow-tests:
    # Тяжёлые PIL-рендеры и полные сбросы — отдельной задачей, чтобы
    # основной прогон оставался быстрым.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Slow tests
        env:
          BOT_TOKEN: "123456:ci-dummy-token"
          ADMIN_IDS: "1"
        run: python -m pytest -q -m slow

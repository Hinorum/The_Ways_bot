services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-way}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-way}
      POSTGRES_DB: ${POSTGRES_DB:-the_way}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - way_pg:/var/lib/postgresql/data

volumes:
  way_pg:

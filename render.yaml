services:
  - type: web
    name: the-ways-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.main
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        sync: false
      # Supabase: сертификат pooler подписан внутренним CA Supabase (не входит
      # в системное хранилище) — приложение верифицирует по этому файлу.
      # Файл certs/supabase-root.pem лежит в репо и попадёт на Render с деплоем.
      - key: DATABASE_CA
        value: certs/supabase-root.pem
      - key: TIMEZONE
        value: Europe/Moscow
      - key: ROUND_SECONDS
        value: "82800"
      - key: TALLY_SECONDS
        value: "3600"
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://router.huggingface.co/v1/chat/completions
      - key: GEMINI_API_KEY
        sync: false
      - key: MEDIA_DIR
        value: ./media/generated
      - key: WEBHOOK_SECRET
        sync: false
      - key: TON_ENABLED
        value: "false"
      - key: TON_NETWORK
        value: mainnet
      - key: TREASURY_ADDRESS
        sync: false
      - key: TREASURY_MNEMONIC
        sync: false
      - key: TREASURY_TESTNET_ADDRESS
        sync: false
      - key: TREASURY_TESTNET_MNEMONIC
        sync: false
      - key: TON_API_BASE
        value: https://tonapi.io
      - key: TON_API_BASE_TESTNET
        value: https://testnet.tonapi.io
      - key: TON_API_KEY
        sync: false
      - key: TREASURY_WALLET_VERSION
        value: "auto"
      - key: TONCENTER_API_BASE
        value: https://toncenter.com
      - key: TONCENTER_API_BASE_TESTNET
        value: https://testnet.toncenter.com
      - key: TONCENTER_API_KEY
        sync: false
      - key: STAKE_MIN_TON
        value: "0.5"
      - key: OWNER_RAKE_PCT
        value: "0.5"
      - key: LEADERBOARD_RAKE_PCT
        value: "0.5"
      - key: WEEKLY_POT_PCT
        value: "2"
      - key: PACK_FUND_PCT
        value: "1"
      - key: WEEKLY_MIN_DAYS
        value: "4"
      - key: WEEKLY_PRIZE_PCTS
        value: "50,30,20"
      - key: OWNER_WALLET_ADDRESS
        sync: false
      - key: STAKE_CONFIRM_SECONDS
        value: "40"
      - key: PAYOUT_MAX_ATTEMPTS
        value: "5"
      - key: WORLD_NAME
        value: "Эхо Стаи"
      - key: REVOTE_ENABLED
        value: "true"
      - key: REVOTE_STARS
        value: "25"
      - key: REVOTE_TON
        value: "0.1"
